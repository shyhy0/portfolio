<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기술 경력 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /*
    Color / type values below are taken directly from the official
    KRDS (대한민국 정부 디자인 시스템) design tokens:
    https://github.com/KRDS-uiux/krds-uiux  (resources/css/token/krds_tokens.css)
  */
  :root {
    /* KRDS primitive — primary (blue) */
    --primary-5:  #ecf2fe;
    --primary-10: #d8e5fd;
    --primary-50: #256ef4;
    --primary-60: #0b50d0;
    --primary-70: #083891;

    /* KRDS primitive — point (red, used for emphasis/active states) */
    --point-5:  #fbeff0;
    --point-50: #d63d4a;
    --point-60: #ab2b36;

    /* KRDS primitive — gray */
    --gray-0:  #ffffff;
    --gray-5:  #f4f5f6;
    --gray-10: #e6e8ea;
    --gray-20: #cdd1d5;
    --gray-30: #b1b8be;
    --gray-40: #8a949e;
    --gray-50: #6d7882;
    --gray-70: #464c53;
    --gray-90: #1e2124;
    --gray-95: #131416;

    /* KRDS semantic aliases actually used on this page */
    --text-basic:  var(--gray-90);
    --text-bolder: var(--gray-95);
    --text-subtle: var(--gray-70);
    --text-primary: var(--primary-60);
    --link-default: var(--primary-50);
    --link-hover:   var(--primary-60);
    --border: var(--gray-10);
    --border-strong: var(--gray-20);
    --border-interactive: var(--gray-40);
    --text-muted-aa: var(--gray-70);
    --surface-primary-subtler: var(--primary-5);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  html { font-size: 62.5%; } /* 1rem = 10px, matches KRDS token scale directly */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--gray-0);
    color: var(--text-basic);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    font-size: 1.7rem; /* krds body-medium */
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 100px; }

  /* header */
  header.top {
    border-top: 4px solid var(--primary-50);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
  }
  .top-inner { max-width: 1080px; margin: 0 auto; }
  h1 {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--text-bolder);
    margin: 0 0 12px;
    line-height: 1.35;
  }
  .role {
    font-size: 1.7rem;
    color: var(--text-subtle);
    margin: 0;
  }

  /* controls */
  .controls {
    position: sticky; top: 0;
    background: var(--gray-0);
    padding: 20px 0 14px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .controls-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #search {
    font-family: inherit;
    font-size: 1.5rem;
    padding: 9px 14px;
    border: 1px solid var(--border-interactive);
    border-radius: 4px;
    background: var(--gray-0);
    color: var(--text-basic);
    width: 260px;
    max-width: 100%;
  }
  #search:focus-visible { outline: 2px solid var(--primary-50); outline-offset: 1px; border-color: var(--primary-50); }
  #search::placeholder { color: var(--text-subtle); }
  .count-note { font-size: 1.4rem; color: var(--text-subtle); margin-left: auto; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    font-family: inherit;
    border: 1px solid var(--border-interactive);
    background: var(--gray-0);
    color: var(--text-basic);
    border-radius: 4px;
    padding: 6px 13px;
    font-size: 1.4rem;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--primary-50); color: var(--text-primary); }
  .chip:focus-visible { outline: 2px solid var(--primary-50); outline-offset: 1px; }
  .chip.active { background: var(--primary-50); border-color: var(--primary-50); color: var(--gray-0); }

  /* table */
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1.5rem; }
  .table-scroll { overflow-x: auto; }
  thead th {
    text-align: left;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text-subtle);
    background: var(--gray-5);
    padding: 11px 12px;
    border-bottom: 2px solid var(--border-strong);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th:hover { color: var(--text-primary); }
  thead th:focus-visible { outline: 2px solid var(--primary-50); outline-offset: -2px; }
  thead th:first-child { border-top-left-radius: 4px; }
  thead th:last-child { border-top-right-radius: 4px; }
  thead th .arrow { font-size: 1.1rem; margin-left: 3px; color: var(--primary-50); }
  tbody td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--surface-primary-subtler); }
  td.col-org { font-weight: 700; color: var(--text-bolder); white-space: nowrap; }
  td.col-title { color: var(--text-basic); }
  td.col-period { font-size: 1.4rem; color: var(--text-subtle); white-space: nowrap; }
  td.col-era { font-size: 1.4rem; color: var(--text-subtle); white-space: nowrap; }
  .proj-tag {
    display: inline-block;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--surface-primary-subtler);
    border-radius: 4px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  a.visit {
    font-size: 1.4rem;
    color: var(--link-default);
    text-decoration: underline;
    text-underline-offset: 2px;
    white-space: nowrap;
  }
  a.visit:hover { color: var(--link-hover); }
  a.visit:focus-visible { outline: 2px solid var(--primary-50); outline-offset: 1px; }
  .visit.muted { font-size: 1.4rem; color: var(--text-muted-aa); white-space: nowrap; }

  .empty-note, .loading-note { padding: 60px 0; text-align: center; color: var(--text-subtle); font-size: 1.5rem; }

  @media (max-width: 720px) {
    thead th, tbody td { white-space: normal; }
  }

</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>공공기관 웹사이트, 18년을 퍼블리싱하다</h1>
    <p class="role">프론트엔드 개발 · 웹퍼블리싱 리드. 지자체·대학·병원·국립기관 홈페이지를 기획부터 접근성 검수까지 책임지며 다수의 구축·개편 사업을 수행했습니다.</p>
  </div>
</header>

<div class="wrap">
<main>

  <div class="controls">
    <div class="controls-row">
      <label for="search" class="sr-only">기관명 또는 프로젝트명으로 검색</label>
      <input id="search" type="text" placeholder="기관명, 프로젝트명 검색">
      <div class="count-note" id="count-note" role="status" aria-live="polite">불러오는 중...</div>
    </div>
    <div class="chip-row" id="cat-chips" role="group" aria-label="기관 유형 필터">
      <button type="button" class="chip active" data-cat="전체" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-cat="지자체" aria-pressed="false">지자체</button>
      <button type="button" class="chip" data-cat="대학교" aria-pressed="false">대학교</button>
      <button type="button" class="chip" data-cat="병원" aria-pressed="false">병원</button>
      <button type="button" class="chip" data-cat="연구기관" aria-pressed="false">연구기관</button>
      <button type="button" class="chip" data-cat="박물관" aria-pressed="false">박물관</button>
      <button type="button" class="chip" data-cat="기타" aria-pressed="false">기타</button>
    </div>
  </div>

  <div class="table-scroll">
  <table id="proj-table">
    <caption class="sr-only">기관명, 프로젝트명, 유형, 기간, 소속, 사이트 링크로 구성된 프로젝트 목록입니다. 열 머리글을 클릭하거나 Enter 키를 누르면 해당 기준으로 정렬됩니다.</caption>
    <thead>
      <tr>
        <th scope="col" data-key="기관명" tabindex="0" role="button" aria-sort="none">기관명 <span class="arrow" aria-hidden="true"></span></th>
        <th scope="col" data-key="프로젝트명" tabindex="0" role="button" aria-sort="none">프로젝트명 <span class="arrow" aria-hidden="true"></span></th>
        <th scope="col" data-key="유형" tabindex="0" role="button" aria-sort="none">유형 <span class="arrow" aria-hidden="true"></span></th>
        <th scope="col" data-key="_date" tabindex="0" role="button" aria-sort="descending">기간 <span class="arrow" aria-hidden="true">▼</span></th>
        <th scope="col" data-key="소속" tabindex="0" role="button" aria-sort="none">소속 <span class="arrow" aria-hidden="true"></span></th>
        <th scope="col">사이트</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="6" class="loading-note">데이터를 불러오는 중입니다...</td></tr>
    </tbody>
  </table>
  </div>

</main>
</div>

<script src="./data.js"></script>
<script>
let ITEMS = [];
let state = { sortKey: '_date', sortDir: 'desc', cat: '전체', q: '' };

function parseDate(period) {
  const m = period.match(/(\d{4})\.(\d{2})/);
  if (!m) return '0000-00';
  return m[1] + '-' + m[2];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  let filtered = ITEMS.filter(it => {
    if (state.cat !== '전체' && it['유형'] !== state.cat) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      const hay = (it['기관명'] + ' ' + it['프로젝트명']).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let av = state.sortKey === '_date' ? a._date : (a[state.sortKey] || '');
    let bv = state.sortKey === '_date' ? b._date : (b[state.sortKey] || '');
    let cmp = av.localeCompare(bv, 'ko');
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  document.getElementById('count-note').textContent = filtered.length + '건 표시 중 (전체 ' + ITEMS.length + '건)';

  const body = document.getElementById('table-body');
  if (filtered.length === 0) {
    body.innerHTML = '<tr><td colspan="6" class="empty-note">해당 조건에 맞는 프로젝트가 없습니다.</td></tr>';
    return;
  }

  body.innerHTML = filtered.map(it => `
    <tr>
      <td class="col-org">${escapeHtml(it['기관명'])}</td>
      <td class="col-title">${escapeHtml(it['프로젝트명'])}</td>
      <td><span class="proj-tag">${escapeHtml(it['유형'])}</span></td>
      <td class="col-period">${escapeHtml(it['기간'])}</td>
      <td class="col-era">${escapeHtml(it['소속'])}</td>
      <td>${it['링크'] ? `<a class="visit" href="${it['링크']}" target="_blank" rel="noopener" aria-label="${escapeHtml(it['기관명'])} 홈페이지 방문 (새 창 열림)">사이트 방문</a>` : `<span class="visit muted">-</span>`}</td>
    </tr>
  `).join('');
}

function updateSortArrows() {
  document.querySelectorAll('#proj-table thead th[data-key]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    const isActive = th.dataset.key === state.sortKey;
    if (arrow) arrow.textContent = isActive ? (state.sortDir === 'asc' ? '▲' : '▼') : '';
    th.setAttribute('aria-sort', isActive ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
  });
}

function toggleSort(key) {
  if (state.sortKey === key) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortKey = key;
    state.sortDir = key === '_date' ? 'desc' : 'asc';
  }
  updateSortArrows();
  render();
}

document.querySelectorAll('#proj-table thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => toggleSort(th.dataset.key));
  th.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleSort(th.dataset.key);
    }
  });
});

document.getElementById('search').addEventListener('input', (e) => { state.q = e.target.value.trim(); render(); });

document.getElementById('cat-chips').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  state.cat = e.target.dataset.cat;
  document.querySelectorAll('#cat-chips .chip').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-pressed', 'false');
  });
  e.target.classList.add('active');
  e.target.setAttribute('aria-pressed', 'true');
  render();
});


try {
  ITEMS = PORTFOLIO_DATA.map(it => Object.assign({}, it, { _date: parseDate(it['기간']) }));
  updateSortArrows();
  render();
} catch (err) {
  document.getElementById('table-body').innerHTML =
    '<tr><td colspan="6" class="empty-note">data.js를 불러오지 못했습니다. index.html과 data.js가 같은 폴더에 있는지 확인해주세요.</td></tr>';
  console.error(err);
}
</script>

</body>
</html>
